<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="#030712" />
  
  <!-- Outer Scope/Lens -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#3B82F6" stroke-width="8" />
  <circle cx="100" cy="100" r="50" fill="none" stroke="#1D4ED8" stroke-width="4" stroke-dasharray="10 10" />
  
  <!-- Code Brackets inside Scope -->
  <path d="M 85 75 L 60 100 L 85 125" fill="none" stroke="#60A5FA" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 115 75 L 140 100 L 115 125" fill="none" stroke="#60A5FA" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Crosshair elements -->
  <line x1="100" y1="20" x2="100" y2="40" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
  <line x1="100" y1="160" x2="100" y2="180" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
  <line x1="20" y1="100" x2="40" y2="100" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
  <line x1="160" y1="100" x2="180" y2="100" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
</svg>